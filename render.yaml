# Temporary free beta: database expires after 30 days; no paid resources.
services:
  - type: web
    name: vinyl-shelf-beta
    runtime: docker
    region: frankfurt
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeployTrigger: off
    healthCheckPath: /api/health/
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_SECRET_KEY_EXTRA
        generateValue: true
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: vinyl-shelf-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: vinyl-shelf-limits
          type: keyvalue
          property: connectionString
  - type: keyvalue
    name: vinyl-shelf-limits
    region: frankfurt
    plan: free
    maxmemoryPolicy: noeviction
    ipAllowList: []
databases:
  - name: vinyl-shelf-db
    region: frankfurt
    plan: free
    postgresMajorVersion: "18"
    databaseName: vinyl_shelf
    user: vinyl_shelf
    ipAllowList: []
